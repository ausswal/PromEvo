{% set name = "comparative_gene_promoter" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/ausswal/comparative-gene-promoter/archive/refs/tags/v0.1.0.tar.gz
  sha256: REPLACE_WITH_REAL_SHA256

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.10,<3.14

  run:
    - python >=3.10,<3.14
    - pandas
    - numpy
    - scipy
    - matplotlib-base
    - seaborn
    - biopython
    - openpyxl
    - scikit-learn
    - requests
    - ncbi-datasets-cli
    - mafft
    - meme
    - orthofinder
    - diamond
    - mcl
    - fasttree

test:
  commands:
    - comparative-gene-promoter-check
    - datasets --version
    - "command -v mafft"
    - "command -v meme"
    - "command -v tomtom"
    - "command -v ceqlogo"
    - "command -v orthofinder"
    - "command -v diamond"
    - "command -v mcl"
    - "command -v fasttree"

about:
  home: https://github.com/ausswal/comparative-gene-promoter
  license: MIT
  license_file: LICENSE.txt
  summary: Comparative gene family and promoter analysis pipeline
  description: |
    A Python-based comparative bioinformatics pipeline for gene-family,
    protein, promoter, transcription-start-site, nucleotide composition,
    core promoter element, motif, CpG, DNA structural property,
    and phylogenetic analyses.
  dev_url: https://github.com/ausswal/comparative-gene-promoter

extra:
  recipe-maintainers:
    - ausswal